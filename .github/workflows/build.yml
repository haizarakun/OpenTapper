name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Generate signing key for the release build
        id: keygen
        continue-on-error: true
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/release.jks" \
            -alias opentapper \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass opentapper -keypass opentapper \
            -dname "CN=OpenTapper, OU=OpenSource, O=OpenTapper, L=City, ST=State, C=US"

      - name: Build release APK
        continue-on-error: true
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: opentapper
          KEY_ALIAS: opentapper
          KEY_PASSWORD: opentapper
        run: gradle --no-daemon assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/OpenTapper-debug.apk || true
          cp app/build/outputs/apk/release/app-release.apk dist/OpenTapper-release.apk || true
          echo "Collected:"; ls -la dist

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenTapper-apks
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v18
          name: OpenTapper v18
          fail_on_unmatched_files: false
          body: |
            Automated build of **OpenTapper** produced by GitHub Actions.

            - `OpenTapper-debug.apk` — installable debug build (recommended for quick testing / sideloading).
            - `OpenTapper-release.apk` — release build, signed with an ephemeral CI key.

            To install, download an APK on your Android device and allow installation from unknown sources.
          files: dist/*.apk
